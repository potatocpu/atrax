<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ViandaSegura — Iniciar sesión</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="login-wrap">

    <section class="login-card">

      <header class="login-head">
        <div class="logo">V</div>
        <h1>ViandaSegura</h1>
        <p class="subtitle">Sistema de gestión de viandas</p>
      </header>

      <form class="login-form" action="#" method="post" novalidate>

        <div class="field">
          <label for="usuario">Usuario o correo</label>
          <input type="text" id="usuario" name="usuario"
                 placeholder="ej. cocina@viandasegura.uy" required>
          <span class="error" id="error-usuario">Ingresá tu usuario o correo.</span>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <div class="pass-box">
            <input type="password" id="password" name="password"
                   placeholder="••••••••" required>
            <button type="button" class="ver" aria-label="Mostrar contraseña">ver</button>
          </div>
          <span class="error" id="error-password">Ingresá tu contraseña.</span>
        </div>

        <div class="options">
          <label class="remember">
            <input type="checkbox" name="recordarme"> Recordarme
          </label>
          <a class="olvide" href="#">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn btn-primario">Ingresar</button>

        <div class="divisor"><span>o</span></div>

        <a class="btn btn-secundario" href="#">Crear cuenta de cliente</a>

      </form>

    </section>

    <footer class="login-foot">
      <p>ViandaSegura © 2026 — Producción y distribución de viandas, Montevideo.</p>
    </footer>

  </main>

</body>
</html>
