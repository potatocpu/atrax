<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ViandaSegura — Acceso del cliente</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="phones">

    <!-- Login -->
    <div class="phone-wrap">
      <div class="phone">
        <div class="notch"></div>
        <div class="screen">
          <div class="screen-pad">
            <div class="brand-head">
              <div class="logo">V</div>
              <h1>ViandaSegura</h1>
              <p class="tagline">Viandas listas y saludables</p>
            </div>

            <div class="field">
              <label for="correo">Correo</label>
              <input type="email" id="correo" placeholder="tu@correo.com">
            </div>
            <div class="field">
              <label for="pass">Contraseña</label>
              <div class="pass-box">
                <input type="password" id="pass" placeholder="••••••">
                <button type="button" class="ver">ver</button>
              </div>
            </div>

            <a class="btn btn-primary" href="#">Ingresar</a>
            <a class="btn btn-ghost" href="#" style="margin-top:12px;">Crear cuenta</a>
            <a class="center-link" href="#">¿Olvidaste tu contraseña?</a>
          </div>
        </div>
      </div>
      <span class="caption">Login</span>
    </div>

    <!-- Registro -->
    <div class="phone-wrap">
      <div class="phone">
        <div class="notch"></div>
        <div class="screen">
          <div class="screen-pad">
            <a class="back" href="#">← Crear cuenta</a>

            <div class="seg">
              <span class="active">Particular</span>
              <span>Empresa</span>
              <span>Inst.</span>
            </div>

            <div class="field"><label>Nombre completo</label><input type="text"></div>
            <div class="field"><label>Correo</label><input type="email"></div>
            <div class="field"><label>Teléfono</label><input type="tel"></div>
            <div class="field"><label>Dirección</label><input type="text"></div>
            <div class="field"><label>Zona</label>
              <select><option>Seleccionar</option><option>Z1 · Centro</option><option>Z2 · Pocitos</option></select>
            </div>
            <div class="field"><label>Contraseña</label><input type="password"></div>

            <a class="btn btn-primary" href="#">Crear cuenta</a>
          </div>
        </div>
      </div>
      <span class="caption">Registro</span>
    </div>

  </div>

</body>
</html>
