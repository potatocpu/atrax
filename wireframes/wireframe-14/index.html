<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ViandaSegura — Menú disponible</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="phones">
    <div class="phone-wrap">
      <div class="phone">
        <div class="notch"></div>
        <div class="screen">
          <div class="app-bar">
            <span class="avatar">V</span>
            <h2>Menú</h2>
            <span class="loc">📍 Pocitos</span>
          </div>

          <div class="screen-pad">
            <div class="seg">
              <span class="active">Semanal</span>
              <span>Quincenal</span>
              <span>Mensual</span>
            </div>

            <div class="dish">
              <div class="dish-photo">[ foto del plato ]</div>
              <div class="dish-body">
                <div class="dish-top">
                  <h3>Milanesa + ensalada</h3>
                  <span class="price">$2.450/sem</span>
                </div>
                <p class="meta">Lun a Vie · disponible</p>
              </div>
            </div>

            <div class="dish">
              <div class="dish-photo">[ foto del plato ]</div>
              <div class="dish-body">
                <div class="dish-top">
                  <h3>Pollo grillado + puré</h3>
                  <span class="price">$2.450/sem</span>
                </div>
                <p class="meta">Lun a Vie · disponible</p>
              </div>
            </div>

            <div class="dish off">
              <div class="dish-photo">[ foto del plato ]</div>
              <div class="dish-body">
                <div class="dish-top">
                  <h3>Quinoa</h3>
                  <span class="tag-off">agotado hoy</span>
                </div>
              </div>
            </div>
          </div>

          <nav class="tabbar">
            <a class="active" href="#">Menú</a>
            <a href="#">Mis pedidos</a>
            <a href="#">Perfil</a>
          </nav>
        </div>
      </div>
      <span class="caption">Catálogo por modalidad</span>
    </div>
  </div>

</body>
</html>
